name: Continuous integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests-ubuntu:
    strategy:
      matrix:
        python-version: [ '3.11', '3.14' ]
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
      - name: Install requirements
        run: python -m pip install ".[test]"
      - name: Check style
        run: pycodestyle .
      - name: Run tests
        run: pytest .

  tests-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'
      - name: Install requirements
        run: python -m pip install ".[test]"
      - name: Run tests
        run: pytest .
